[package]
name = "contextor"
version = "0.1.0"
edition = "2021"
description = "Long-term memory store for JARVIS — accepts pre-computed vectors, stores and retrieves via cosine similarity"
license = "AGPL-3.0"

[[bin]]
name = "contextor"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
dirs = "5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
